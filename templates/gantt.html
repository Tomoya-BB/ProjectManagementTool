{% extends 'base.html' %}
{% block content %}
<section class="workspace-hero">
  <div>
    <p class="eyebrow">Schedule view</p>
    <h1 class="workspace-title">ガントチャート</h1>
    <p class="workspace-copy">期間別に並べて、計画の重なりと依存の流れを確認できます。</p>
  </div>
  <form method="get" class="toolbar-group toolbar-group-compact">
    <label class="toolbar-label" for="gantt-release">表示対象</label>
    <select id="gantt-release" name="release" class="form-select" onchange="this.form.submit()">
      <option value="">全てのリリース</option>
      {% for r in releases %}
      <option value="{{ r }}" {% if selected_release == r %}selected{% endif %}>{{ r }}</option>
      {% endfor %}
    </select>
    {% if selected_release %}
      <a href="{{ url_for('gantt_chart') }}" class="btn btn-outline-secondary">解除</a>
    {% endif %}
  </form>
</section>
<section class="surface-panel timeline-panel">
  {% if gantt %}
    <div class="plot-frame">
      {{ gantt|safe }}
    </div>
  {% else %}
    <p class="empty-state">表示するタスクがありません。</p>
  {% endif %}
</section>
{% endblock %}

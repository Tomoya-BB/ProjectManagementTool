{% extends "base.html" %}
{% block content %}
<section class="workspace-hero">
  <div>
    <p class="eyebrow">Open</p>
    <h1 class="workspace-title">プロジェクトを開く</h1>
    <p class="workspace-copy">既存の project.json を読み込んで、対応するデータベースを開きます。</p>
  </div>
</section>

<section class="surface-panel auth-panel">
  <form method="POST" enctype="multipart/form-data" class="row g-3">
    <div class="col-12">
      <label class="form-label">プロジェクトファイル</label>
      <input type="file" name="project_file" class="form-control" accept=".json" required>
      <small class="form-hint">選択したプロジェクトフォルダ内の <code>db.sqlite3</code> を読み込みます。</small>
    </div>
    <div class="col-12">
      <button type="submit" class="btn btn-primary">開く</button>
    </div>
  </form>
</section>
{% endblock %}
